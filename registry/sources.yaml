# Source registry — the single source of truth for what may report events.
#
# Adding a site or an app is ONE COMMIT here. `make sync` applies it: allowed origins for the
# web ingest, a write key for apps, and the partition value used in the Iceberg archive.
#
# This file lives in a PUBLIC repo, so it carries NO SECRETS — only public identifiers.
# Write keys are derived at sync time and stored as Worker secrets.
#
# `id` is permanent: it is the partition key in the archive. Renaming one orphans history.
#
# `public: true` publishes a source's numbers on the open-startup page at /open. It is OPT-IN
# and defaults to false — a source added tomorrow stays private until someone decides
# otherwise, because the opposite mistake cannot be taken back.

sites:
  - id: superduperai
    url: https://superduperai.co
    public: true
  - id: live2play
    url: https://live2play.superduperai.co
    public: true
  - id: life2film
    url: https://life2film.com
    public: true
  - id: facealarm
    url: https://face-alarm.com
  - id: you2idea
    url: https://you2idea.com
  - id: miralinka
    url: https://miralinka.com
  - id: miralinka-marafon
    url: https://marafon.miralinka.com
  - id: books
    url: https://books.superduperai.co
  - id: rusty
    url: https://rusty.superduperai.co
  - id: promptwizard
    url: https://prompt.superduperai.co
  # Фото на визу и паспорт. Переехал с photo.superduperai.co на свой домен 5 августа 2026 —
  # поменялся только `url`: `id` партиционирует архив, и переименование осиротило бы историю.
  # Хост здесь не косметика: ingest сверяет с ним origin и молча отбрасывает чужие события.
  - id: visaphoto
    url: https://visayes.app
  # Выключен: старый редактор, домен не отвечает. Остаётся здесь, а не удаляется — id
  # партиционирует архив, и без строки история под этим именем становится необъяснимой.
  - id: editor
    url: https://editor.superduperai.co
    retired: true
  - id: rustman
    url: https://rustman.org
  - id: akbuzat
    url: https://akbuzat.net
  # Тот же id, что у приложения ниже — один продукт, одна воронка, как у live2play.
  # `id` постоянен: он партиционирует архив. Если сайт переедет на carettafriends.com,
  # менять надо только `url`, иначе история осиротеет.
  - id: carettafriends
    url: https://app.carettafriends.com

# Apple `app_id` is the App Store Connect numeric id — handy for joining store analytics later.
apps:
  - id: live2play
    platform: ios
    bundle_id: co.superduperai.live2play
    app_id: "6794370589"
    site: live2play          # same product as the site above → shared id, one funnel

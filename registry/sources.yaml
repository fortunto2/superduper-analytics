# Числовые размерности, которые можно СЧИТАТЬ, а не только прочитать глазами.
#
# `metrics` на событии уезжают одним JSON в blob11, и SQL Analytics Engine внутрь JSON не
# смотрит — функций для этого у него нет. Поэтому «средняя длина серии» или «сколько снимков
# делают люди на восьмом месяце» по metrics не считаются никак, хотя сами числа лежат целыми.
# Считаются только те, что попали в СВОЙ double-слот, — и вот их список.
#
# Порядок — это позиция в `double2..double20` (double1 занят собственным временем события).
# Отсюда правило, то же самое, что у блобов: строки только ДОПИСЫВАЮТСЯ в конец. Переставить
# две — значит задним числом переименовать все исторические значения, молча и необратимо;
# `make check` это ловит, сверяя порядок со сгенерированным файлом.
#
# Словарь ОБЩИЙ для всех источников, а не свой у каждого. Иначе `double2` значил бы у facealarm
# одно, а у visaphoto другое, и любой запрос без фильтра по source складывал бы разные величины.
# Имена поэтому подбираются переиспользуемыми: `days_since_first` одинаково честен для серии
# селфи и для подписки.
#
# Клиенту делать ничего не надо: он как слал `metrics: { … }`, так и шлёт. Имя из этого списка
# попадает и в JSON, и в свой слот; имя не из списка — только в JSON, и это не ошибка, а просто
# «пока не агрегируется». Включить его — одна строка здесь и `make gen`.
#
# ВАЖНО: ноль в слоте означает и «прислали ноль», и «не прислали ничего» — двух разных чисел
# на одной позиции не бывает. Поэтому агрегат всегда сужают по имени события (`blob3`), а не
# берут по всей таблице: событие, которое такую метрику не шлёт, иначе утянет среднее к нулю.
metrics:
  # Сколько дней прошло от самого раннего элемента серии до этого. Когортная величина: отделяет
  # новичка от человека, который снимает восьмой месяц. Дат не содержит — только расстояние
  # между двумя, поэтому ничего о человеке не сообщает и в декларацию Apple не добавляет строк.
  - days_since_first
  # Сколько элементов в серии на момент события: снимков, чеков, записей. Имя нарочно без
  # предметности — слот один на всех, и `photos_total` застрял бы на приложениях про фото.
  - items_total
  # Длина получившегося контента в секундах: фильма, ролика, записи. Отвечает «что люди на
  # самом деле заказывают» — тридцать секунд или три минуты. Не `film_seconds`: слот общий, а
  # фильм есть не у всех.
  - content_seconds
  # Wall-clock рендера. Отвечает «не тормозит ли», и это единственная длительность со слотом:
  # `work_seconds`, `agent_seconds` и прочая внутренняя хронометрия живут в JSON, потому что
  # агрегат по ним нужен раз в квартал, а слот тратится навсегда.
  - render_seconds
